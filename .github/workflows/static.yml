# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Generate all artifacts
        run: ./generate_all.sh --with-maritime

      - name: Verify airports.json
        run: |
          python3 - <<'EOF'
          import json, sys, time

          path = "docs/airports.json"
          t0 = time.perf_counter()
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          elapsed = time.perf_counter() - t0

          count = len(data)
          print(f"airports.json loaded {count} entries in {elapsed*1000:.1f} ms")
          if count < 1000:
              print(f"FAIL: expected at least 1000 airports, got {count}", file=sys.stderr)
              sys.exit(1)
          if elapsed > 5.0:
              print(f"FAIL: airports.json took {elapsed:.2f}s to load (threshold: 5s)", file=sys.stderr)
              sys.exit(1)
          print("PASS")
          EOF

      - name: Build WASM
        run: make wasm

      - name: Prepare dist directory
        run: |
          mkdir -p dist/wasm
          cp docs/app.js dist/
          cp docs/app.css dist/
          cp docs/sw.js dist/
          cp docs/best-worker.js dist/
          cp docs/airports.json dist/
          cp docs/wasm/nuke_blob.bin dist/wasm/
          cp docs/wasm/nuke_kernel.js dist/wasm/
          cp docs/wasm/nuke_kernel.wasm dist/wasm/
          python3 scripts/generate_static_index.py
          cp docs/index.html dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
